version: "3.9"

# Nota (2026-09-11, deploy VPS): el servicio "db" (Postgres) del compose
# original nunca existió en la app real — el backend usa SQLite local
# (backend/fortress.db, ver app/core/signal_ledger.py) desde el día uno.
# Se saca acá: no aporta nada y reservaba 2G de RAM sin uso.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/fortress.db:/app/fortress.db
    deploy:
      resources:
        limits:
          memory: 4G

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G