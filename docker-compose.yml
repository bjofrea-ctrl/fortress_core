version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fortress_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/fortress_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/data:/app/data
    deploy:
      resources:
        limits:
          memory: 4G

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pgdata: